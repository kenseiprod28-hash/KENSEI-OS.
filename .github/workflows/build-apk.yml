
name: Build KENSEI OS APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'KENSEI-OS-Source.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source
        run: unzip -q KENSEI-OS-Source.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p KENSEI-OS assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KENSEI-OS-APK
          path: KENSEI-OS/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
