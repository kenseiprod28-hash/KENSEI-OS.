
name: Build KENSEI OS APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -q KENSEI-OS-Source.zip

      - name: Build APK
        run: |
          chmod +x KENSEI-OS/gradlew || true
          if [ -f KENSEI-OS/gradlew ]; then
            cd KENSEI-OS
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper missing"
            exit 1
          fi

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: KENSEI-OS-APK
          path: KENSEI-OS/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
